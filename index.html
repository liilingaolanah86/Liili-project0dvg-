const terminal=document.getElementById("terminal");

function wait(ms){
    return new Promise(r=>setTimeout(r,ms));
}

async function type(text,speed=30){

    return new Promise(resolve=>{

        const line=document.createElement("div");
        line.className="line";

        terminal.appendChild(line);

        const cursor=document.createElement("span");
        cursor.className="cursor";

        line.appendChild(cursor);

        let i=0;

        const timer=setInterval(()=>{

            if(i<text.length){

                line.insertBefore(document.createTextNode(text[i]),cursor);

                i++;

                terminal.scrollTop=terminal.scrollHeight;

            }else{

                clearInterval(timer);

                cursor.remove();

                setTimeout(resolve,500);

            }

        },speed);

    });

}

<body>

<div class="card" id="card">
  <h1>📋 Commerce Legends — Final Report</h1>
  <div class="progress" id="progress">Question 1 of 7</div>
  <div class="question" id="questionText"></div>
  <div class="btn-row" id="btnRow"></div>
  <div class="system-msg" id="systemMsg"></div>
</div>

<button id="tinyBtn" style="display:none;">✅ Yes</button>

<script>
const questions = [
  { text: "Do you agree with this report?", correct: "yes", dodge: "no", msg: "System: Excellent. Correct answer recorded." },
  { text: "Are you the quiet student?", correct: "no", dodge: "yes", msg: "System: Volume levels confirmed." },
  { text: "Are you a good student?", correct: "no", dodge: "yes", msg: "System: Honesty detected." },
  { text: "Are you a Sigma?", correct: "yes", dodge: "no", msg: "System: Aura level increasing..." },
  { text: "Are you the secret main character of this school?", correct: "yes", dodge: "no", msg: "System: Plot armor activated." },
  { text: "Have you ever spent a solid hour practicing your signature for when you're famous?", correct: "yes", dodge: "no", msg: "System: Future celebrity profile created." },
];

let current = 0;
const card = document.getElementById('card');
const progressEl = document.getElementById('progress');
const questionEl = document.getElementById('questionText');
const btnRow = document.getElementById('btnRow');
const systemMsg = document.getElementById('systemMsg');

function renderQuestion() {
  systemMsg.textContent = "";
  const q = questions[current];
  progressEl.textContent = `Question ${current + 1} of ${questions.length + 1}`;
  questionEl.textContent = q.text;
  btnRow.innerHTML = "";

  const correctBtn = document.createElement('button');
  correctBtn.className = `answer ${q.correct}`;
  correctBtn.textContent = q.correct === "yes" ? "✅ Yes" : "❌ No";

  const dodgeBtn = document.createElement('button');
  dodgeBtn.className = `answer ${q.dodge} dodge`;
  dodgeBtn.textContent = q.dodge === "yes" ? "✅ Yes" : "❌ No";
  dodgeBtn.style.left = "0px";
  dodgeBtn.style.top = "0px";

  // dodge behavior on hover
  function runAway() {
    const maxX = btnRow.clientWidth - 90;
    const maxY = btnRow.clientHeight - 45;
    const newX = Math.max(0, Math.random() * maxX);
    const newY = Math.max(0, Math.random() * maxY);
    dodgeBtn.style.left = newX + "px";
    dodgeBtn.style.top = newY + "px";
  }
  dodgeBtn.addEventListener('mouseenter', runAway);
  dodgeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(); }, { passive: false });

  correctBtn.addEventListener('click', () => {
    systemMsg.textContent = q.msg;
    setTimeout(() => {
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        showFinalQuestion();
      }
    }, 900);
  });

  btnRow.style.position = "relative";
  btnRow.appendChild(correctBtn);
  btnRow.appendChild(dodgeBtn);
}

function showFinalQuestion() {
  progressEl.textContent = `Final Question`;
  questionEl.textContent = "Are you ready for your future?";
  btnRow.innerHTML = "";
  systemMsg.textContent = "";

  const tinyBtn = document.getElementById('tinyBtn');
  tinyBtn.style.display = "block";
  placeTinyRandomly();

  let moveInterval = setInterval(placeTinyRandomly, 700);

  tinyBtn.onclick = () => {
    clearInterval(moveInterval);
    tinyBtn.style.display = "none";
    showEndScreen();
  };
}

function placeTinyRandomly() {
  const tinyBtn = document.getElementById('tinyBtn');
  const margin = 40;
  const x = margin + Math.random() * (window.innerWidth - 2 * margin);
  const y = margin + Math.random() * (window.innerHeight - 2 * margin);
  tinyBtn.style.left = x + "px";
  tinyBtn.style.top = y + "px";
}

function showEndScreen() {
  card.innerHTML = `
    <div class="end-screen" style="display:flex;">
      <h2>You're going to have a great day.</h2>
      <p>Good luck, Commerce Legends.</p>
      <p class="stamp">— END OF REPORT —</p>
    </div>
  `;
}

renderQuestion();

await type("END OF REPORT");

}   // closes boot()

intro();   // starts the website

</script>
